services:
  backend:
    build: .
    container_name: chat-backend
    expose:
      - "8000"
    environment:
      # Comma-separated origins allowed to open the WebSocket. Empty means
      # same-origin only. Example: https://chat.example.com
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
    security_opt:
      - no-new-privileges:true
    restart: always

  nginx:
    image: nginx:alpine
    container_name: chat-nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: always
