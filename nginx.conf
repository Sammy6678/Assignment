events {
    worker_connections 1024;
}

http {
    include mime.types;

    server_tokens off;
    client_max_body_size 1m;

    server {
        listen 80;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' ws: wss:; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

        # Serve frontend files
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # WebSocket proxy for FastAPI
        location /ws {
            proxy_pass http://backend:8000; # Use the Docker Compose service name, not localhost
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade; # Forward the client's WebSocket upgrade request
            proxy_set_header Connection "upgrade"; # Keep the connection open as a WebSocket tunnel
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Origin $http_origin;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
