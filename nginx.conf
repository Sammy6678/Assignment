events {
    worker_connections 1024;
}

http {
    include mime.types;

    server {
        listen 80;

        # Serve frontend files
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # WebSocket proxy for FastAPI
        location /ws {
            proxy_pass http://backend:8000; # Use the Docker Compose service name, not localhost
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade; # Forward the client's WebSocket upgrade request
            proxy_set_header Connection "upgrade"; # Keep the connection open as a WebSocket tunnel
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
